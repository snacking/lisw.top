name: Build, test and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        type: boolean
        default: false
        description: Deploy the prebuilt artifact to VPS
permissions:
  contents: read
concurrency:
  group: panel-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
          cache-dependency-path: backend/go.sum
      - run: go test -race ./... && go vet ./...
        working-directory: backend
      - name: Compile and package on GitHub runner
        run: bash scripts/build-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: panel-linux-amd64
          path: artifacts/panel-linux-amd64.tar.gz
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: mock-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: panel-linux-amd64
      - name: Upload artifact and restart (no VPS build)
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ vars.VPS_HOST || '198.12.74.38' }}
          VPS_USER: ${{ vars.VPS_USER || 'root' }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          scp -i ~/.ssh/deploy_key -o BatchMode=yes panel-linux-amd64.tar.gz "$VPS_USER@$VPS_HOST:/tmp/lisw-panel-${{ github.sha }}.tar.gz"
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" bash -s -- '${{ github.sha }}' < deploy/install-release.sh
