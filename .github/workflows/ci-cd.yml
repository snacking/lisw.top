name: Build, test and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        type: boolean
        default: false
        description: Deploy mock preview to VPS loopback port 18081
permissions:
  contents: read
concurrency:
  group: panel-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - run: npm ci && npm run build
        working-directory: frontend
      - run: go test -race ./... && go vet ./...
        working-directory: backend
      - run: mkdir -p release && cd backend && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o ../release/panel .
      - run: cp -r frontend/dist release/dist && cp deploy/panel.service release/ && tar -czf panel.tar.gz -C release .
      - uses: actions/upload-artifact@v4
        with:
          name: panel-linux-amd64
          path: panel.tar.gz
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: mock-preview
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: panel-linux-amd64
      - name: Deploy isolated mock preview
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS" && test -n "$VPS_HOST" && test -n "$VPS_USER"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          scp -i ~/.ssh/deploy_key -o BatchMode=yes panel.tar.gz "$VPS_USER@$VPS_HOST:/tmp/lisw-panel-${{ github.sha }}.tar.gz"
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          release=/opt/lisw-panel/releases/${{ github.sha }}
          sudo install -d "$release"
          sudo tar -xzf /tmp/lisw-panel-${{ github.sha }}.tar.gz -C "$release"
          previous=$(readlink -f /opt/lisw-panel/current || true)
          sudo ln -sfn "$release" /opt/lisw-panel/current
          sudo cp "$release/panel.service" /etc/systemd/system/lisw-panel.service
          sudo systemctl daemon-reload
          sudo systemctl enable lisw-panel
          if ! sudo systemctl restart lisw-panel; then
            if [ -n "$previous" ]; then sudo ln -sfn "$previous" /opt/lisw-panel/current; sudo systemctl restart lisw-panel; fi
            exit 1
          fi
          healthy=false
          for attempt in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:18081/api/health; then healthy=true; break; fi
            sleep 2
          done
          if [ "$healthy" != true ]; then
            if [ -n "$previous" ]; then sudo ln -sfn "$previous" /opt/lisw-panel/current; sudo systemctl restart lisw-panel; fi
            exit 1
          fi
          rm -f /tmp/lisw-panel-${{ github.sha }}.tar.gz
          REMOTE
